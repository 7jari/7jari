# This is a basic workflow to try to build https://github.com/salvogiangri/UN1CA under GitHub Actions

name: "Build UN1CA under GitHub Actions"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo path"
        required: true
        type: string
      branch:
        description: "Branch name"
        required: true
        type: string
      device:
        description: "Device codename"
        required: true
        default: "a05s"
        type: string
      debug_build:
        description: "Debug build"
        required: true
        default: false
        type: boolean
      pixeldrain:
        description: "Upload to Pixeldrain (make sure you set up the secrets variable with name PIXELDRAIN_API_KEY)"
        required: true
        default: false
        type: boolean
      file:
        description: "File name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: "Build UN1CA"
    runs-on: ubuntu-24.04
    steps:
        - name: "Checkout"
          uses: actions/checkout@v6
          
        - name: "Free disk space (1/3)"
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo docker builder prune -a

        - name: "Free disk space (2/3)"
          uses: jlumbroso/free-disk-space@main
          with:
            tool-cache: true

        - name: "Free disk space (3/3)"
          uses: rokibhasansagar/slimhub_actions@main
          with:
            retain: 'compiler_cmake'

        - name: "Set up dependencies"
          run: |
            sudo apt update
            sudo apt upgrade -y
            DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              7zip attr ccache clang ffmpeg \
              libbrotli-dev libbz2-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
              libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp openjdk-17-jdk
            sudo modprobe erofs f2fs

        - name: "Clone forked repo"
          run: |
            git clone --recurse-submodules -b ${{ github.event.inputs.branch }} --single-branch https://github.com/${{ github.event.inputs.repo }} UN1CA
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        - name: "Build it!"
          run: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            cd UN1CA
            if [[ "${{ github.event.inputs.debug_build }}" = "true" ]]; then
            source buildenv.sh --debug ${{ github.event.inputs.device }}
            else
            source buildenv.sh ${{ github.event.inputs.device }}
            fi
            run_cmd make_rom --build-rom-zip

        - name: "Upload ROM to Pixeldrain"
          if: ${{ github.event.inputs.pixeldrain == 'true' }}
          run: |
            curl -T "$(ls UN1CA/out/${{ github.event.inputs.file }})" -u :${{ secrets.PIXELDRAIN_API_KEY }} https://pixeldrain.com/api/file/

        - name: "Upload ROM to GoFile"
          if: ${{ github.event.inputs.pixeldrain != 'true' }}
          uses: 7jari/gofile-upload@v2
          with:
            files: "UN1CA/out/${{ github.event.inputs.file }}"
            server: "upload-ap-sgp"
     
