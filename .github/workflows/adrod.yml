name: "Android Buildbotting Final Boss"

on:
  workflow_dispatch:
    inputs:
      repo_manifest:
        description: "Repo manifest"
        required: true
        type: string
      repo_branch:
        description: "Repo manifest's branch"
        required: true
        type: string
      local_manifest:
        description: "Personal local manifest [repository or raw]"
        required: true
        type: string
      local_branch:
        description: "Personal local manifest's branch (required for repository cloning)"
        required: false
        type: string
      device_name:
        description: "Device's codename"
        required: true
        type: string
      product_name:
        description: "Product to build"
        required: true
        type: string
      build_command:
        description: 'Command to be used for compiling'
        required: true
        default: 'mka bacon'
      build_type:
        description: 'Type of build'
        required: true
        default: 'userdebug'
        type: choice
        options: 
        - 'eng'
        - 'userdebug'
        - 'user'
      microg:
        description: 'Integrate microG (Linag only)'
        required: false
        type: boolean
      artifact:
        description: 'Output file to upload'
        required: true
        type: string
      missing:
        description: 'Allow missing dependencies'
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build Adrod"
    runs-on: ubuntu-22.04
    steps:
        - name: "Checkout"
          uses: actions/checkout@v6

        - name: "Free disk space (1/3)"
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo docker builder prune -a

        - name: "Free disk space (2/3)"
          uses: jlumbroso/free-disk-space@main
          with:
            preinstalled-runtimes: true

        - name: "Free disk space (3/3)"
          uses: rokibhasansagar/slimhub_actions@main

        - name: "Set up dependencies"
          run: |
            sudo apt update
            DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              bc bison curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev \
              lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lib32ncurses5-dev libncurses5 libncurses5-dev linux-modules-extra-$(uname -r)

        - name: "Set up zram"
          run: |
            sudo modprobe zram
            totalmem=$(LC_ALL=C free | grep -e "^Mem:" | sed -e 's/^Mem: *//' -e 's/  *.*//')
            mem=$((totalmem * 3 * 1024))
            sleep 2
            sudo zramctl /dev/zram0 -s $mem -a lz4
            sudo mkswap /dev/zram0
            sudo swapon -p 100 /dev/zram0

        - name: "Set up adrod repo"
          run: |
            mkdir -p ~/bin
            mkdir ./adrodsrc
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            export PATH="$HOME/bin:$PATH"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cd ./adrodsrc
            repo init -u ${{ github.event.inputs.repo_manifest }} -b ${{ github.event.inputs.repo_branch }} --depth=1 --git-lfs --no-clone-bundle
            if [ -n "${{ github.event.inputs.local_branch }}" ]; then
              git clone --depth=1 ${{ github.event.inputs.local_manifest }} -b ${{ github.event.inputs.local_branch }} .repo/local_manifests
            else
              curl -o .repo/local_manifests/local_manifest.xml ${{ github.event.inputs.local_manifest }} --create-dirs
            fi
            repo sync -j8

        - name: "Display remaining disk space"
          run: |
            df -h /

        - name: "Build adrod!"
          timeout-minutes: 330
          run: |
            cd ./adrodsrc
            if [ ${{ github.event.inputs.missing }} = true ]; then
              export ALLOW_MISSING_DEPENDENCIES=true
            fi
            if [ ${{ github.event.inputs.microg }} = true ]; then
              git clone --depth=1 https://github.com/lineageos4microg/android_vendor_partner_gms.git -b master vendor/partner_gms
              export WITH_GMS=true
            fi
            source build/envsetup.sh
            lunch ${{ github.event.inputs.product_name }}-${{ github.event.inputs.build_type }}
            ${{ github.event.inputs.build_command }} -j8

        - name: "To GitHub Artifacts"
          uses: actions/upload-artifact@v7
          with:
            name: "${{ github.event.inputs.product_name }}-${{github.run_id}}-artifacts"
            path: adrodsrc/out/target/product/${{ github.event.inputs.device_name }}/${{ github.event.inputs.artifact }}
