name: "Adrod Builder Thingy"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build UN1CA"
    runs-on: ubuntu-22.04
    steps:
        - name: "Checkout"
          uses: actions/checkout@v6
          
        - name: "Free disk space (1/3)"
          uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
          with:
            remove_android: true
            remove_dotnet: true
            remove_haskell: true
            remove_tool_cache: true
            remove_swap: true
            remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
            remove_packages_one_command: true
            remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
            rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
            rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
            testing: false

        - name: "Free disk space (2/3)"
          uses: jlumbroso/free-disk-space@main
          with:
            tool-cache: true

        - name: "Free disk space (3/3)"
          uses: rokibhasansagar/slimhub_actions@main
          with:
            retain: 'compiler_cmake'

        - name: "Set up dependencies"
          run: |
            sudo apt update
            sudo apt upgrade -y
            DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev \
              lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lib32ncurses5-dev libncurses5 libncurses5-dev

        - name: "Set up adrod repo"
          run: |
            mkdir -p ~/bin
            mkdir ./adrodsrc
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            repo init -u https://github.com/PixelExperience-LEGACY-edition/manifest.git -b thirteen-plus --depth=1 --git-lfs
            repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

        - name: "Check disk space"
          run: |
            df -h /
