name: "Android Buildbotting Final Boss"

on:
  workflow_dispatch:
    inputs:
      repo_manifest:
        description: "Repo manifest"
        required: true
        type: string
      repo_branch:
        description: "Repo manifest's branch"
        required: true
        type: string
      local_manifest:
        description: "Personal local manifest [repository or raw]"
        required: false
        type: string
      local_branch:
        description: "Personal local manifest's branch (required for repository cloning)"
        required: false
        type: string
      device_name:
        description: "Device's codename"
        required: true
        type: string
      product_name:
        description: "Product to build"
        required: true
        type: string
      build_command:
        description: 'Command to be used for compiling'
        required: true
        default: 'mka bacon'
      build_type:
        description: 'Type of build'
        required: true
        default: 'userdebug'
        type: choice
        options: 
        - 'eng'
        - 'userdebug'
        - 'user'
      microg:
        description: 'Integrate microG (Linag only)'
        required: false
        type: boolean
      artifact:
        description: 'Upload artifact'
        required: true
        type: boolean
      missing:
        description: 'Allow missing dependencies'
        required: true
        type: boolean
      artiname:
        description: 'Artifact name'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: "Build Adrod"
    runs-on: ubuntu-24.04
    steps:
        - name: "Checkout"
          uses: actions/checkout@v6

        - name: "Set up environment variables"
          run: |
            echo "ALLOW_MISSING_DEPENDENCIES=${{ github.event.inputs.missing }}" >> "$GITHUB_ENV"
            echo "BUILD_USERNAME=${{ github.actor }}" >> "$GITHUB_ENV"
            echo "BUILD_HOSTNAME=ADROD" >> "$GITHUB_ENV"
            echo "WITH_GMS=${{ github.event.inputs.microg }}" >> "$GITHUB_ENV"

        - name: "Free disk space (1/3)"
          run: |
            sudo docker image prune --all --force
            sudo docker builder prune -a

        - name: "Free disk space (2/3)"
          uses: jlumbroso/free-disk-space@main
          with:
            preinstalled-runtimes: true

        - name: "Free disk space (3/3)"
          uses: rokibhasansagar/slimhub_actions@main

        - name: "Set up dependencies"
          run: |
            wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
            wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
            DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              bc g++-multilib gcc-multilib gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev \
              libgnutls28-dev libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc linux-modules-extra-$(uname -r)
            sudo modprobe btrfs  

        - name: "Set up zram"
          run: |
            sudo modprobe zram
            totalmem=$(LC_ALL=C free | grep -e "^Mem:" | sed -e 's/^Mem: *//' -e 's/  *.*//')
            mem=$((totalmem * 3 * 1024))
            sleep 1
            sudo zramctl /dev/zram0 -s $mem
            sudo mkswap /dev/zram0
            sudo swapon -p 100 /dev/zram0

        - name: "Set up adrod repo"
          run: |
            mkdir -p ~/bin
            mkdir ./adrodsrc
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            export PATH="$HOME/bin:$PATH"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            IMG_SIZE="$(($(df -k --output=avail "$GITHUB_WORKSPACE" | tail -n 1) - 102400))"
            truncate -s ${IMG_SIZE}K adrod.img
            mkfs.btrfs adrod.img
            sudo mount adrod.img ./adrodsrc -o defaults,noatime,compress-force=zstd,space_cache=v2,commit=120
            sudo chown "$(id -un):$(id -gn)" ./adrodsrc
            cd ./adrodsrc
            repo init -u ${{ github.event.inputs.repo_manifest }} -b ${{ github.event.inputs.repo_branch }} --depth=1 --git-lfs --no-clone-bundle
            if [ -n "${{ github.event.inputs.local_manifest }}" ]; then
            if [ -n "${{ github.event.inputs.local_branch }}" ]; then
            git clone --depth=1 ${{ github.event.inputs.local_manifest }} -b ${{ github.event.inputs.local_branch }} .repo/local_manifests
            else
            curl -o .repo/local_manifests/local_manifest.xml ${{ github.event.inputs.local_manifest }} --create-dirs
            fi
            fi
            repo sync -c -j8

        - name: "Display remaining disk space"
          run: |
            df -h "$GITHUB_WORKSPACE/adrodsrc"

        - name: "Build adrod!"
          timeout-minutes: 330
          run: |
            cd ./adrodsrc
            git clone --depth=1 https://github.com/Rares6567/new_rbe_fix tutorial
            bash tutorial/scripts/build_patched_reclient.sh ./
            patch -p1 < tutorial/patches/android-rbe-buildbuddyfix-defaults.patch
            if [ ${{ github.event.inputs.microg }} = true ]; then
              git clone --depth=1 https://github.com/lineageos4microg/android_vendor_partner_gms.git -b master vendor/partner_gms
            fi
            source build/envsetup.sh
            export USE_RBE=1
            export RBE_DIR="$GITHUB_WORKSPACE/adrodsrc/prebuilts/remoteexecution-client/buildbuddyfix"
            export NINJA_REMOTE_NUM_JOBS=32
            export RBE_use_unified_downloads=true
            export RBE_use_unified_uploads=true
            export RBE_R8_EXEC_STRATEGY=remote_local_fallback
            export RBE_D8_EXEC_STRATEGY=remote_local_fallback
            export RBE_JAVAC_EXEC_STRATEGY=remote_local_fallback
            export RBE_JAR_EXEC_STRATEGY=remote_local_fallback
            export RBE_ZIP_EXEC_STRATEGY=remote_local_fallback
            export RBE_TURBINE_EXEC_STRATEGY=remote_local_fallback
            export RBE_SIGNAPK_EXEC_STRATEGY=remote_local_fallback
            export RBE_CXX_EXEC_STRATEGY=remote_local_fallback
            export RBE_CXX_LINKS_EXEC_STRATEGY=remote_local_fallback
            export RBE_ABI_LINKER_EXEC_STRATEGY=remote_local_fallback
            export RBE_CLANG_TIDY_EXEC_STRATEGY=remote_local_fallback
            export RBE_METALAVA_EXEC_STRATEGY=remote_local_fallback
            export RBE_LINT_EXEC_STRATEGY=remote_local_fallback
            export RBE_R8=1
            export RBE_D8=1
            export RBE_JAVAC=1
            export RBE_JAR=1
            export RBE_ZIP=1
            export RBE_TURBINE=1
            export RBE_SIGNAPK=1
            export RBE_CXX_LINKS=1
            export RBE_CXX=1
            export RBE_ABI_LINKER=1
            export RBE_CLANG_TIDY=1
            export RBE_METALAVA=1
            export RBE_LINT=1
            export RBE_JAVA_POOL=default
            export RBE_METALAVA_POOL=default
            export RBE_LINT_POOL=default
            export RBE_reclient_timeout=60m
            export RBE_exec_timeout=10m
            export RBE_service="remote.buildbuddy.io:443"
            export RBE_remote_headers="x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}"
            export RBE_use_rpc_credentials=false
            export RBE_service_no_auth=true
            lunch ${{ github.event.inputs.product_name }}-${{ github.event.inputs.build_type }}
            ${{ github.event.inputs.build_command }}

        - name: "Upload to GitHub Artifacts"
          if: ${{ github.event.inputs.artifact == 'true' }}
          uses: actions/upload-artifact@v7
          with:
            name: "${{ github.event.inputs.product_name }}-${{github.run_id}}-artifacts"
            path: adrodsrc/out/target/product/${{ github.event.inputs.device_name }}/${{ github.event.inputs.artiname }}
